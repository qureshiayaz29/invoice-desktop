name: invoice_generator
description: A Flutter desktop app for generating invoices offline.
publish_to: 'none' # Prevent accidental publishing

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Adjust based on your Flutter SDK version

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1 # Use latest compatible version

  # Database (Drift/SQLite)
  drift: ^2.15.0         # Use latest compatible version
  sqlite3_flutter_libs: ^0.5.22 # Required for Drift on desktop/mobile
  path_provider: ^2.1.3 # To find storage location
  path: ^1.9.0          # For path manipulation

  # PDF Generation & Printing/Sharing
  pdf: ^3.10.8          # Use latest compatible version
  printing: ^5.12.0     # Use latest compatible version

  # Formatting (Dates)
  intl: ^0.19.0         # Use latest compatible version

  # Add other dependencies if needed
  # cupertino_icons: ^1.0.6 # Example if using Cupertino icons

  # File Handling
  open_filex: ^4.7.0

  # window size handling
  window_size: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift Code Generation
  drift_dev: ^2.15.0     # Use latest compatible version (match drift version)
  build_runner: ^2.4.9   # Use latest compatible version

  # Linter
  flutter_lints: ^3.0.0 # Or your preferred linter

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/ # Uncomment and add path if you include a logo image
